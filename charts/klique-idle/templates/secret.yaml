{{- if and (include "kic.secretName" .) (not .Values.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kic.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ include "kic.tokenValue" . | quote }}
{{- end }}
{{- if and .Values.cloud.apiKey (not .Values.cloud.existingSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kic.fullname" . }}-cloud
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kic.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.cloud.apiKey | quote }}
{{- end }}
