# -- Cluster name shown on the dashboard. Required.
cluster: ""

# -- Where the collectors POST reports. Empty: to the hub (hub.enabled), else
# the pod logs. Set it only to send straight to your own server.
endpoint: ""

# -- Bearer token the collectors send (to the hub, or to `endpoint`). The hub
# requires it, also for GET /v1/nodes. With the hub and no token set, the chart
# generates one and keeps it across upgrades (GitOps tools that can't look up
# the Secret should set one). Stored in a Secret; prefer existingSecret.
token: ""

existingSecret:
  # -- Name of an existing Secret holding the token (overrides `token`).
  name: ""
  # -- Key of the token inside that Secret.
  key: token

# -- Extra labels sent with every report, e.g. {site: sjc-1, env: prod}.
labels: {}

collector:
  # -- How often each node is read.
  sampleInterval: 2s
  # -- How often each node sends a report.
  reportInterval: 10s
  # -- GPU source: nvml (real GPUs), fake (simulated GPUs, for demos and
  # clusters without GPUs) or none.
  gpu: nvml
  fake:
    # -- Simulated GPUs per node (gpu: fake).
    gpus: 8
    # -- Simulated model: a100, h100, h200, b200 or l40s.
    model: h100
  # -- Replace user, job, pod and process names with hashes.
  redact: false
  # -- Also send GPU process command lines (may contain secrets passed as arguments).
  includeCmdline: false
  # -- gzip request bodies (the server must accept Content-Encoding: gzip).
  gzip: false
  # -- Extra CA certificate for the endpoint: name of a ConfigMap with a `ca.crt` key.
  caConfigMap: ""
  # -- debug, info, warn or error.
  logLevel: info
  # -- text or json.
  logFormat: text
  # -- Extra command-line flags, e.g. ["--queue-size=720"].
  extraArgs: []
  # -- Extra environment variables for the collector container.
  extraEnv: []

image:
  # -- One image holds both the collector and the hub.
  repository: kliqueai/klique-idle-collector
  # -- Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nvidia:
  # -- RuntimeClass giving the pod access to the NVIDIA driver. "auto" uses
  # "nvidia" when that RuntimeClass exists (GPU Operator installs it); set ""
  # when nvidia is already the node's default runtime, or name another class.
  runtimeClassName: auto
  # -- The collector sees GPUs through the NVIDIA container runtime instead of
  # requesting nvidia.com/gpu, so it never takes a GPU away from workloads.
  visibleDevices: all
  # -- "utility" is enough for NVML (what nvidia-smi uses); no compute access.
  driverCapabilities: utility
  # -- Also request the GPUs through a volume mount, the way the NVIDIA device
  # plugin does. Needed where the container toolkit ignores the env-var request
  # from unprivileged pods (GPU Operator toolkit setting
  # ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED=false), harmless
  # elsewhere. If neither request is honoured, the last resort is
  # securityContext.privileged=true, which is what DCGM exporters use.
  requestViaVolumeMount: true
  # -- Leave a node while the GPU Operator upgrades its driver or changes MIG
  # partitions (node label nvidia.com/gpu.deploy.*=paused-for-driver-upgrade /
  # paused-for-mig-change), the way the operator's own components do. Without
  # this the collector keeps the GPU open and the old driver can't be unloaded,
  # so the upgrade hangs. Ignored when `affinity`
  # is set: then add the same rule to your affinity yourself.
  pauseDuringDriverUpgrade: true

# -- Share the host PID namespace, so GPU processes can be matched to their
# pods. Without it, reports still have GPU usage but no process/pod names.
hostPID: true

rbac:
  # -- Create a ClusterRole allowing get on nodes and list on pods (pod names,
  # GPU allocation per node). Without it, reports carry pod UIDs only.
  create: true

serviceAccount:
  create: true
  # -- Defaults to the release fullname.
  name: ""
  annotations: {}

# -- Run only on GPU nodes. The label is set by NVIDIA GPU Feature Discovery
# (part of the GPU Operator); adjust if your GPU nodes are labelled
# differently, or set {} with collector.gpu=fake.
nodeSelector:
  nvidia.com/gpu.present: "true"

# -- Tolerate every taint, so the collector also runs on dedicated GPU nodes.
tolerations:
  - operator: Exists

affinity: {}
priorityClassName: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Lets the non-root user read the mounted token.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: [ALL]

# -- Port of the collector's /healthz (liveness probe). It also answers /metrics
# for its own node; on Kubernetes scrape the hub instead (metrics.serviceMonitor).
healthPort: 9478

podAnnotations: {}
podLabels: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 10%

# The cluster hub: the collectors report to it. It serves the latest state of
# every node as Prometheus metrics at /metrics (for Grafana), the latest
# reports as JSON at /v1/nodes, and forwards to Klique Cloud only when
# `cloud` is configured.
hub:
  enabled: true
  # -- Forget nodes that haven't reported for this long.
  staleAfter: 2m
  # -- Log every report as full JSON (kubectl logs deploy/<release>-hub).
  dump: false
  service:
    # -- Lets annotation-based Prometheus setups find /metrics.
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /metrics
  # -- Extra environment variables, e.g. HTTPS_PROXY for the Klique Cloud connection.
  extraEnv: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Klique Cloud (https://idle.klique.ai): OFF unless an API key is set. With a
# key, the hub forwards every report there, unchanged; without one, nothing
# leaves the cluster.
cloud:
  # -- API key from your Klique Cloud account. Stored in a Secret created by
  # the chart; prefer existingSecret.
  apiKey: ""
  existingSecret:
    # -- Name of an existing Secret holding the API key (overrides `apiKey`).
    name: ""
    # -- Key of the API key inside that Secret.
    key: api-key
  endpoint: https://idle.klique.ai/v1/reports

metrics:
  serviceMonitor:
    # -- Create a ServiceMonitor for the hub (needs the Prometheus Operator,
    # e.g. kube-prometheus-stack).
    enabled: false
    # -- Match the collectors' report interval, so no 10 s window is missed.
    interval: 10s
    # -- Extra labels, if your Prometheus selects ServiceMonitors by label
    # (e.g. {release: kube-prometheus-stack}).
    labels: {}

grafanaDashboard:
  # -- Ship the Grafana dashboard as a ConfigMap for Grafana's dashboard
  # sidecar (on by default in kube-prometheus-stack). Without the sidecar,
  # import dashboards/klique-idle.json by hand.
  enabled: false
  labels:
    grafana_dashboard: "1"
  # -- e.g. {grafana_folder: GPUs} with the sidecar's folderAnnotation set.
  annotations: {}
