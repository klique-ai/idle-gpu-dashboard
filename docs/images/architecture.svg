<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 490" width="1140" height="490" role="img" aria-label="Klique Idle GPU Dashboard architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Klique Idle GPU Dashboard architecture</title><style>
.bg{fill:#ffffff}.region{fill:#f6f8fa;stroke:#d0d7de}.box{fill:#ffffff;stroke:#c3cbd4}
.dash{fill:none;stroke:#aab4bf;stroke-dasharray:5 4}.dashbox{fill:#ffffff;stroke:#aab4bf;stroke-dasharray:5 4}
.t{fill:#1f2328;font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.h{fill:#1f2328;font:700 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:#59636e;font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.lab{fill:#59636e;font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.06em}
.chip{fill:#e6fbf1;stroke:#1a9e62}.chipt{fill:#0b6b40;font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.cc{fill:#e6fbf1;stroke:#1a9e62;stroke-width:1.5}
.cloud{fill:#eef4ff;stroke:#4a72d9;stroke-width:1.5}
.ln{stroke:#6e7781;stroke-width:1.5;fill:none}.ah{fill:#6e7781}
.busy{fill:#8c959f}.idle{fill:#2fbf7a}.held{fill:#d4a72c}.unk{fill:none;stroke:#8c959f;stroke-dasharray:3 2}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.region{fill:#161b22;stroke:#30363d}.box{fill:#0d1117;stroke:#3d444d}
.dash{stroke:#56606b}.dashbox{fill:#0d1117;stroke:#56606b}
.t,.h{fill:#e6edf3}.s,.lab{fill:#9198a1}
.chip{fill:#0f2e22;stroke:#3fbf85}.chipt{fill:#64f3ae}.cc{fill:#0f2e22;stroke:#64f3ae}
.cloud{fill:#14203a;stroke:#6e93ff}.ln{stroke:#8b949e}.ah{fill:#8b949e}
.busy{fill:#545d68}.idle{fill:#64f3ae}.held{fill:#e3b341}.unk{stroke:#768390}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs><rect class="bg" width="1140" height="490" rx="12"/><rect class="region" x="20" y="20" width="720" height="450" rx="14"/><text class="lab" x="40" y="46" text-anchor="start">YOUR NETWORK</text><rect class="box" x="40" y="70" width="220" height="104" rx="10"/><text class="t" x="56" y="94" text-anchor="start">GPU node 1</text><rect class="chip" x="56" y="104" width="188" height="28" rx="6"/><text class="chipt" x="150" y="123" text-anchor="middle">Collector</text><rect class="busy" x="56" y="144" width="18" height="16" rx="3"/><rect class="busy" x="80" y="144" width="18" height="16" rx="3"/><rect class="busy" x="104" y="144" width="18" height="16" rx="3"/><rect class="idle" x="128" y="144" width="18" height="16" rx="3"/><rect class="idle" x="152" y="144" width="18" height="16" rx="3"/><rect class="idle" x="176" y="144" width="18" height="16" rx="3"/><rect class="busy" x="200" y="144" width="18" height="16" rx="3"/><rect class="busy" x="224" y="144" width="18" height="16" rx="3"/><path class="ln" d="M260,118 L288,118 L288,238"/><rect class="box" x="40" y="190" width="220" height="104" rx="10"/><text class="t" x="56" y="214" text-anchor="start">GPU node 2</text><rect class="chip" x="56" y="224" width="188" height="28" rx="6"/><text class="chipt" x="150" y="243" text-anchor="middle">Collector</text><rect class="idle" x="56" y="264" width="18" height="16" rx="3"/><rect class="idle" x="80" y="264" width="18" height="16" rx="3"/><rect class="idle" x="104" y="264" width="18" height="16" rx="3"/><rect class="idle" x="128" y="264" width="18" height="16" rx="3"/><rect class="idle" x="152" y="264" width="18" height="16" rx="3"/><rect class="idle" x="176" y="264" width="18" height="16" rx="3"/><rect class="idle" x="200" y="264" width="18" height="16" rx="3"/><rect class="idle" x="224" y="264" width="18" height="16" rx="3"/><path class="ln" marker-end="url(#a)" d="M260,238 L436,238"/><rect class="box" x="40" y="330" width="220" height="104" rx="10"/><text class="t" x="56" y="354" text-anchor="start">GPU node N</text><rect class="chip" x="56" y="364" width="188" height="28" rx="6"/><text class="chipt" x="150" y="383" text-anchor="middle">Collector</text><rect class="busy" x="56" y="404" width="18" height="16" rx="3"/><rect class="busy" x="80" y="404" width="18" height="16" rx="3"/><rect class="busy" x="104" y="404" width="18" height="16" rx="3"/><rect class="busy" x="128" y="404" width="18" height="16" rx="3"/><rect class="unk" x="152" y="404" width="18" height="16" rx="3"/><rect class="unk" x="176" y="404" width="18" height="16" rx="3"/><rect class="held" x="200" y="404" width="18" height="16" rx="3"/><rect class="held" x="224" y="404" width="18" height="16" rx="3"/><path class="ln" d="M260,378 L288,378 L288,238"/><text class="s" x="150" y="316" text-anchor="middle">⋮</text><text class="s" x="304" y="140" text-anchor="start">Samples every 2 s,</text><text class="s" x="304" y="156" text-anchor="start">reports every 10 s</text><text class="s" x="304" y="300" text-anchor="start">Bare metal, Slurm, PBS:</text><text class="s" x="304" y="316" text-anchor="start">each node serves</text><text class="s" x="304" y="332" text-anchor="start">/metrics and reports</text><text class="s" x="304" y="348" text-anchor="start">directly instead</text><rect class="cc" x="440" y="160" width="270" height="128" rx="12"/><text class="t" x="458" y="188" text-anchor="start">Hub</text><text class="s" x="458" y="208" text-anchor="start">One per cluster · Kubernetes only</text><text class="s" x="458" y="234" text-anchor="start">• Gathers the collectors' reports</text><text class="s" x="458" y="251" text-anchor="start">• Serves the /metrics endpoint</text><text class="s" x="458" y="268" text-anchor="start">• The single exit point</text><path class="ln" marker-end="url(#a)" d="M575,288 L575,346"/><rect class="dashbox" x="440" y="350" width="270" height="96" rx="12"/><text class="t" x="458" y="376" text-anchor="start">Your Prometheus + Grafana</text><text class="s" x="458" y="400" text-anchor="start">Default · scrapes /metrics</text><text class="s" x="458" y="418" text-anchor="start">Ready-made Grafana dashboard</text><path class="ln" marker-end="url(#a)" d="M710,224 L856,224"/><text class="s" x="752" y="212" text-anchor="start">Outbound only</text><text class="s" x="752" y="244" text-anchor="start">HTTPS + API key</text><text class="lab" x="860" y="46" text-anchor="start">HOSTED BY KLIQUE · OPTIONAL</text><rect class="cloud" x="860" y="160" width="260" height="128" rx="12"/><text class="t" x="878" y="188" text-anchor="start">Klique dashboard</text><text class="s" x="878" y="208" text-anchor="start">idle.klique.ai</text><text class="s" x="878" y="234" text-anchor="start">• All sites and clusters</text><text class="s" x="878" y="251" text-anchor="start">• Savings and model comparisons</text><text class="s" x="878" y="268" text-anchor="start">• AWS Bedrock pricing</text><text class="lab" x="860" y="346" text-anchor="start">GPU STATE</text><rect class="busy" x="860" y="358" width="18" height="16" rx="3"/><text class="s" x="886" y="371" text-anchor="start">Busy</text><rect class="idle" x="860" y="382" width="18" height="16" rx="3"/><text class="s" x="886" y="395" text-anchor="start">Idle</text><rect class="held" x="860" y="406" width="18" height="16" rx="3"/><text class="s" x="886" y="419" text-anchor="start">Idle, memory held</text><rect class="unk" x="860" y="430" width="18" height="16" rx="3"/><text class="s" x="886" y="443" text-anchor="start">Unknown (MIG)</text></svg>