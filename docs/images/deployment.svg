<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" role="img" aria-label="Klique Idle GPU Dashboard deployment on Kubernetes and on bare metal, Slurm and PBS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Klique Idle GPU Dashboard deployment on Kubernetes and on bare metal, Slurm and PBS</title><style>
.bg{fill:#ffffff}.region{fill:#f6f8fa;stroke:#d0d7de}.box{fill:#ffffff;stroke:#c3cbd4}
.dash{fill:none;stroke:#aab4bf;stroke-dasharray:5 4}.dashbox{fill:#ffffff;stroke:#aab4bf;stroke-dasharray:5 4}
.t{fill:#1f2328;font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.h{fill:#1f2328;font:700 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:#59636e;font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.lab{fill:#59636e;font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.06em}
.chip{fill:#e6fbf1;stroke:#1a9e62}.chipt{fill:#0b6b40;font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.cc{fill:#e6fbf1;stroke:#1a9e62;stroke-width:1.5}
.cloud{fill:#eef4ff;stroke:#4a72d9;stroke-width:1.5}
.ln{stroke:#6e7781;stroke-width:1.5;fill:none}.ah{fill:#6e7781}
.busy{fill:#8c959f}.idle{fill:#2fbf7a}.held{fill:#d4a72c}.unk{fill:none;stroke:#8c959f;stroke-dasharray:3 2}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.region{fill:#161b22;stroke:#30363d}.box{fill:#0d1117;stroke:#3d444d}
.dash{stroke:#56606b}.dashbox{fill:#0d1117;stroke:#56606b}
.t,.h{fill:#e6edf3}.s,.lab{fill:#9198a1}
.chip{fill:#0f2e22;stroke:#3fbf85}.chipt{fill:#64f3ae}.cc{fill:#0f2e22;stroke:#64f3ae}
.cloud{fill:#14203a;stroke:#6e93ff}.ln{stroke:#8b949e}.ah{fill:#8b949e}
.busy{fill:#545d68}.idle{fill:#64f3ae}.held{fill:#e3b341}.unk{stroke:#768390}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs><rect class="bg" width="1120" height="460" rx="12"/><rect class="region" x="20" y="20" width="530" height="420" rx="14"/><text class="h" x="40" y="50" text-anchor="start">Kubernetes</text><text class="s" x="40" y="70" text-anchor="start">One Helm command</text><rect class="dashbox" x="125" y="92" width="320" height="112" rx="12"/><text class="lab" x="141" y="112" text-anchor="start">NAMESPACE: KLIQUE-IDLE</text><rect class="cc" x="145" y="122" width="280" height="66" rx="10"/><text class="t" x="285" y="148" text-anchor="middle">Hub</text><text class="s" x="285" y="168" text-anchor="middle">One per cluster · serves /metrics</text><rect class="box" x="40" y="282" width="156" height="140" rx="10"/><text class="t" x="54" y="306" text-anchor="start">GPU node 1</text><rect class="chip" x="54" y="316" width="128" height="28" rx="6"/><text class="chipt" x="118" y="335" text-anchor="middle">Collector</text><text class="s" x="54" y="366" text-anchor="start">DaemonSet pod</text><text class="s" x="54" y="383" text-anchor="start">Requests no GPUs</text><text class="s" x="54" y="400" text-anchor="start">~20 MB memory</text><path class="ln" marker-end="url(#a)" d="M118,282 L118,250 L285,250 L285,206"/><rect class="box" x="207" y="282" width="156" height="140" rx="10"/><text class="t" x="221" y="306" text-anchor="start">GPU node 2</text><rect class="chip" x="221" y="316" width="128" height="28" rx="6"/><text class="chipt" x="285" y="335" text-anchor="middle">Collector</text><text class="s" x="221" y="366" text-anchor="start">DaemonSet pod</text><text class="s" x="221" y="383" text-anchor="start">Requests no GPUs</text><text class="s" x="221" y="400" text-anchor="start">~20 MB memory</text><path class="ln" marker-end="url(#a)" d="M285,282 L285,206"/><rect class="box" x="374" y="282" width="156" height="140" rx="10"/><text class="t" x="388" y="306" text-anchor="start">GPU node N</text><rect class="chip" x="388" y="316" width="128" height="28" rx="6"/><text class="chipt" x="452" y="335" text-anchor="middle">Collector</text><text class="s" x="388" y="366" text-anchor="start">DaemonSet pod</text><text class="s" x="388" y="383" text-anchor="start">Requests no GPUs</text><text class="s" x="388" y="400" text-anchor="start">~20 MB memory</text><path class="ln" marker-end="url(#a)" d="M452,282 L452,250 L285,250 L285,206"/><rect class="region" x="570" y="20" width="530" height="420" rx="14"/><text class="h" x="590" y="50" text-anchor="start">Bare metal, Slurm and PBS</text><text class="s" x="590" y="70" text-anchor="start">install.sh on each GPU node · port 9478</text><rect class="dashbox" x="590" y="92" width="490" height="112" rx="12"/><text class="lab" x="606" y="112" text-anchor="start">EACH NODE REPORTS DIRECTLY TO</text><rect class="cloud" x="606" y="122" width="224" height="66" rx="10"/><text class="t" x="718" y="148" text-anchor="middle">Klique dashboard</text><text class="s" x="718" y="168" text-anchor="middle">With an API key</text><rect class="box" x="840" y="122" width="224" height="66" rx="10"/><text class="t" x="952" y="148" text-anchor="middle">Your Prometheus</text><text class="s" x="952" y="168" text-anchor="middle">Scrapes /metrics</text><rect class="box" x="590" y="282" width="156" height="140" rx="10"/><text class="t" x="604" y="306" text-anchor="start">GPU node 1</text><rect class="chip" x="604" y="316" width="128" height="28" rx="6"/><text class="chipt" x="668" y="335" text-anchor="middle">Collector</text><text class="s" x="604" y="366" text-anchor="start">systemd service</text><text class="s" x="604" y="383" text-anchor="start">Requests no GPUs</text><text class="s" x="604" y="400" text-anchor="start">No job slot</text><path class="ln" marker-end="url(#a)" d="M668,282 L668,206"/><rect class="box" x="757" y="282" width="156" height="140" rx="10"/><text class="t" x="771" y="306" text-anchor="start">GPU node 2</text><rect class="chip" x="771" y="316" width="128" height="28" rx="6"/><text class="chipt" x="835" y="335" text-anchor="middle">Collector</text><text class="s" x="771" y="366" text-anchor="start">systemd service</text><text class="s" x="771" y="383" text-anchor="start">Requests no GPUs</text><text class="s" x="771" y="400" text-anchor="start">No job slot</text><path class="ln" marker-end="url(#a)" d="M835,282 L835,206"/><rect class="box" x="924" y="282" width="156" height="140" rx="10"/><text class="t" x="938" y="306" text-anchor="start">GPU node N</text><rect class="chip" x="938" y="316" width="128" height="28" rx="6"/><text class="chipt" x="1002" y="335" text-anchor="middle">Collector</text><text class="s" x="938" y="366" text-anchor="start">systemd service</text><text class="s" x="938" y="383" text-anchor="start">Requests no GPUs</text><text class="s" x="938" y="400" text-anchor="start">No job slot</text><path class="ln" marker-end="url(#a)" d="M1002,282 L1002,206"/></svg>